<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Video Jungle - Curated educational videos for phonics and reading">
    <title>Video Jungle | AdilLab</title>
    
    <!-- Add Arabic font support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/landing.css">
    <link rel="stylesheet" href="/assets/css/modules.css">
    <link rel="stylesheet" href="/assets/css/rtl.css">
    
    <!-- Icon Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="module-nav secondary-border" role="navigation" aria-label="Video tutorials navigation">
        <a href="/" aria-label="Return to AdilLab home">
            <img src="/assets/images/Logo.png" alt="AdilLab Logo" data-i18n-alt="logo_alt">
            <span data-i18n="nav_brand">AdilLab</span>
        </a>
        <div style="display: flex; gap: 15px; align-items: center;">
            <!-- Language Switcher -->
            <div class="lang-select-wrapper" style="display: flex; align-items: center; gap: 5px;">
                <i data-lucide="globe" size="18" color="#666"></i>
                <select onchange="window.setLanguage(this.value)" id="lang-selector" class="lang-dropdown" style="border: 1px solid #ccc; padding: 5px; border-radius: 5px; background: white; color: #333;">
                    <option value="fr">Français (FR)</option>
                    <option value="en">English (EN)</option>
                    <option value="ar">العربية (AR)</option>
                </select>
            </div>

            <a href="/index.html" class="btn btn-secondary" aria-label="Return home">
                <i data-lucide="home" size="18" aria-hidden="true"></i>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="module-content">
        <h1 class="module-title" style="color: var(--secondary);" data-i18n="service_videos_title">
            Video Jungle
        </h1>
        <p class="module-subtitle" data-i18n="service_videos_desc">
            Curated educational videos to master phonics, blending, and reading rules
        </p>

        <!-- Category Filters -->
        <div class="filter-container" role="group" aria-label="Filter videos by category">
            <button 
                class="pill active" 
                onclick="filterVideos('all')" 
                aria-pressed="true"
                data-category="all"
                data-i18n="videos_all"
            >
                All Videos
            </button>
            <button 
                class="pill" 
                onclick="filterVideos('phonics')"
                aria-pressed="false"
                data-category="phonics"
                data-i18n="videos_phonics"
            >
                Phonics
            </button>
            <button 
                class="pill" 
                onclick="filterVideos('reading')"
                aria-pressed="false"
                data-category="reading"
                data-i18n="videos_reading"
            >
                Reading
            </button>
            <button 
                class="pill" 
                onclick="filterVideos('blending')"
                aria-pressed="false"
                data-category="blending"
                data-i18n="videos_blending"
            >
                Blending
            </button>
        </div>

        <!-- Video Grid (Uses landing page grid system) -->
        <div 
            id="vid-grid" 
            class="services-grid container"
            role="list"
            aria-label="Educational videos"
        >
            <!-- Dynamically populated by videoTutorials.js -->
        </div>
    </main>

    <footer id="global-footer"></footer>

    <!-- i18n System -->
    <script src="/assets/js/i18n.js"></script>

    <!-- Initialize -->
    <script src="/assets/js/components.js"></script>
    <script>
        lucide.createIcons();
        document.addEventListener('DOMContentLoaded', loadGlobalComponents);
    </script>
    <script src="/assets/js/videoTutorials.js"></script>
</body>
</html>
