<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Ideas</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <a href="../index.html" class="lang-btn">⬅ Home</a>
            <h1 id="page-title">Spelling Ideas</h1>
            <div id="lang-switcher">
                <button data-lang="fr" class="lang-btn">FR</button>
                <button data-lang="en" class="lang-btn">EN</button>
                <button data-lang="ar" class="lang-btn">AR</button>
            </div>
        </div>

        <div id="ideas-container">
            <!-- JS injects .content-grid and .card here -->
        </div>
    </div>

    <!-- Simple Modal (Reusing CSS modal classes) -->
    <div id="idea-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="close-btn">&times;</button>
            <div class="modal-body">
                <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                    <h2 id="modal-title" style="margin:0; color:var(--color-egypt);"></h2>
                    <button id="modal-tts-btn" class="lang-btn">🔊</button>
                </div>
                <div id="modal-level-badge" style="display:inline-block; padding:5px 10px; border-radius:5px; color:white; margin-bottom:15px; font-weight:bold;"></div>
                
                <h3 id="modal-steps-title">Tutorial</h3>
                <ul id="modal-steps" style="line-height:1.6; color:#555;"></ul>
                
                <h3 id="modal-benefits-title">Benefits</h3>
                <p id="modal-benefits" style="color:#555;"></p>
            </div>
        </div>
    </div>

    <script src="../assets/js/ideasMnemonics.js"></script>
</body>
</html>
