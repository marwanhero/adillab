<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lettres Vivantes | AdilLab</title>
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/modules.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <nav class="module-nav">
        <a href="/" class="nav-brand">
            <img src="/assets/images/Logo.png" alt="AdilLab">
            <span>AdilLab</span>
        </a>
        <div style="display: flex; gap: 15px; align-items: center;">
            <div class="lang-select-wrapper" style="display: flex; align-items: center; gap: 5px;">
                <i data-lucide="globe" size="18" color="#666"></i>
                <select onchange="window.setLanguage(this.value)" id="lang-selector" class="lang-dropdown" style="border: 1px solid #ccc; padding: 5px; border-radius: 5px; background: white; color: #333;">
                    <option value="fr">Français (FR)</option>
                    <option value="en">English (EN)</option>
                    <option value="ar">العربية (AR)</option>
                </select>
            </div>
            <a href="/" class="btn btn-secondary"><i data-lucide="home"></i> <span data-i18n="nav_home">Accueil</span></a>
        </div>
    </nav>

    <main class="module-content">
        <h1 class="module-title" data-i18n="service_letters_title">Lettres Vivantes</h1>
        <p id="streak-display" class="module-subtitle" aria-live="polite">Série: 0 🔥</p>

        <div class="game-container">
            <div id="target-emoji" class="word-spot">⏳</div>
            
            <div id="slots-area"></div>
            
            <div id="letters-area"></div>
            
            <h3 id="feedback"></h3>
            <button id="next-btn" class="btn btn-primary hidden">Suivant ➡</button>
        </div>
    </main>

    <footer id="global-footer"></footer>

    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/safariAudio.js"></script>
    <script src="/assets/js/components.js"></script>
    <script type="module" src="/assets/js/games.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadGlobalComponents);
    </script>
</body>
</html>
