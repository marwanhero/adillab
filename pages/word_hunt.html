<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Word Hunt - Search for hidden words in the grid">
    <title>Word Hunt | AdilLab</title>
    
    <!-- Add Arabic font support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/landing.css">
    <link rel="stylesheet" href="../assets/css/modules.css">
    <link rel="stylesheet" href="../assets/css/rtl.css">
    
    <style>
        .word-hunt-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
            margin-top: 40px;
        }
        #word-grid {
            display: grid;
            gap: 8px;
            background: #2D3748;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            user-select: none;
            touch-action: none;
        }
        .grid-cell {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            transition: all 0.1s;
        }
        .grid-cell:hover { transform: scale(1.1); }
        .grid-cell.selected {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 10px var(--primary);
        }
        .grid-cell.found-perm {
            background: #d1fae5;
            color: #059669;
            border: 2px solid #059669;
        }
        #words-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
        }
        .word-item {
            padding: 12px 20px;
            background: white;
            border-radius: 10px;
            border: 2px solid #f0f0f0;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .word-item.found {
            background: #d1fae5;
            color: #059669;
            border-color: transparent;
            text-decoration: line-through;
        }
        @media (max-width: 600px) {
            .grid-cell { width: 40px; height: 40px; font-size: 1.2rem; }
        }
    </style>

    <!-- Icon Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="module-nav" role="navigation" aria-label="Game navigation">
        <a href="../index.html" class="nav-brand" aria-label="Return to AdilLab home">
            <img src="../assets/images/Logo.png" alt="AdilLab Logo" data-i18n-alt="logo_alt">
            <span data-i18n="nav_brand">AdilLab</span>
        </a>
        <div style="display: flex; gap: 15px; align-items: center;">
            <div class="lang-select-wrapper" style="display: flex; align-items: center; gap: 5px;">
                <i data-lucide="globe" size="18" color="#666"></i>
                <select onchange="window.setLanguage(this.value)" id="lang-selector" class="lang-dropdown" style="border: 1px solid #ccc; padding: 5px; border-radius: 5px; background: white; color: #333;">
                    <option value="fr">Français (FR)</option>
                    <option value="en">English (EN)</option>
                    <option value="ar">العربية (AR)</option>
                </select>
            </div>
            <a href="../index.html" class="btn btn-secondary" aria-label="Return home">
                <i data-lucide="home" size="18" aria-hidden="true"></i>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="module-content">
        <div class="text-center">
            <h1 class="module-title" data-i18n="word_hunt_title">Word Hunt</h1>
            <div style="display: flex; justify-content: center; gap: 30px; margin-bottom: 30px; font-weight: 700; color: #666; font-size: 1.2rem;">
                <span><i data-lucide="clock" style="vertical-align: middle;"></i> <span id="timer">2:00</span></span>
                <span><i data-lucide="star" style="vertical-align: middle;"></i> <span id="score">0</span> XP</span>
            </div>
        </div>

        <!-- Difficulty Selector -->
        <div class="difficulty-selector">
            <button class="difficulty-btn active" data-difficulty="easy">
                <span class="difficulty-badge" style="background: #00D9A5"></span> Easy
            </button>
            <button class="difficulty-btn" data-difficulty="medium">
                <span class="difficulty-badge" style="background: #FF9E2A"></span> Medium
            </button>
            <button class="difficulty-btn" data-difficulty="hard">
                <span class="difficulty-badge" style="background: #6C5CE7"></span> Hard
            </button>
        </div>

        <!-- Game Area -->
        <div class="word-hunt-container">
            <div id="word-grid">
                <!-- 6x6 Grid -->
            </div>
            <div id="words-list">
                <!-- Target Words -->
            </div>
        </div>
    </main>

    <!-- Result Modal -->
    <div id="result-modal" class="modal-overlay hidden" style="display: flex;">
        <div class="modal-card text-center" style="padding: 40px; max-width: 400px;">
            <h2 id="modal-title" style="color: var(--primary);">Victory!</h2>
            <p id="modal-msg" style="font-size: 1.5rem; font-weight: 700; margin: 20px 0;">Score: 150 XP</p>
            <button id="restart-btn" class="btn btn-primary">Play Again</button>
            <button onclick="location.href='../index.html'" class="btn btn-secondary mt-4">Exit</button>
        </div>
    </div>

    <!-- Footer -->
    <footer style="background: #2D3748; color: white; padding: 80px 20px 40px; border-top: 5px solid var(--primary);">
        <div class="container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 50px; align-items: start;">
            
            <div class="footer-profile" style="text-align: center;">
                <div style="position: relative; display: inline-block; margin-bottom: 25px;">
                    <img src="../assets/images/Adil.jpeg" alt="Adil BK" class="high-res-profile" onerror="this.src='https://via.placeholder.com/140?text=Adil+BK'">
                    <div style="position: absolute; bottom: 8px; right: 8px; background: var(--accent); width: 22px; height: 22px; border-radius: 50%; border: 3px solid #2D3748;"></div>
                </div>
                <h3 style="color: var(--primary); margin: 0 0 10px 0; font-size: 1.8rem;">Adil BK</h3>
                <p data-i18n="footer_adil_bio" style="font-size: 0.95rem; line-height: 1.6; color: #A0AEC0; max-width: 350px; margin: 0 auto;"></p>
            </div>

            <div class="footer-mission">
                <h4 style="color: white; border-bottom: 2px solid var(--secondary); display: inline-block; padding-bottom: 5px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px;" data-i18n="footer_mission_title">Notre Mission</h4>
                <p data-i18n="footer_mission_text" style="font-size: 1rem; line-height: 1.8; color: #cbd5e0;"></p>
            </div>

            <div class="footer-contact">
                <h4 style="color: white; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px;" data-i18n="footer_contact_title">Contactez-nous</h4>
                <div style="display: grid; grid-template-columns: 1fr; gap: 20px;">
                    <a href="https://www.instagram.com/VOTRE_PROFIL" target="_blank" class="social-link instagram">
                        <i data-lucide="instagram"></i> <span>Instagram</span>
                    </a>
                    <a href="https://www.facebook.com/VOTRE_PROFIL" target="_blank" class="social-link facebook">
                        <i data-lucide="facebook"></i> <span>Facebook</span>
                    </a>
                    <a href="https://wa.me/212600000000" target="_blank" class="social-link whatsapp">
                        <i data-lucide="message-circle"></i> <span>WhatsApp</span>
                    </a>
                    <a href="mailto:votre.email@gmail.com" class="social-link gmail">
                        <i data-lucide="mail"></i> <span>Gmail</span>
                    </a>
                </div>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 60px; padding-top: 30px; border-top: 1px solid #4A5568; font-size: 0.85rem; color: #718096;">
            <p>&copy; 2026 AdilLab. Créé par <strong>Adil BK</strong> | Étudiant à l'OFPPT CFJ AL KARIA SALE.</p>
        </div>
    </footer>

    <!-- Audio Manager -->
    <script src="../assets/js/safariAudio.js"></script>

    <!-- i18n System -->
    <script src="../assets/js/i18n.js"></script>

    <!-- Game Logic -->
    <script>lucide.createIcons();</script>
    <script type="module" src="../assets/js/wordHunt.js"></script>
</body>
</html>
